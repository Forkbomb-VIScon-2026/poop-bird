name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: npm ci
      - run: npm run check:rust
      - run: npm run test:rust
      - run: npm run build:wasm
      - run: npm run test:wasm
      - run: npm run lint
      - run: npm test
      # Includes the typecheck
      - run: npm run build
      # The debug variant must keep compiling too, but is never deployed
      - run: npm run build:debug
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t poop-bird:ci .
      - run: docker build -f collector/Dockerfile -t poop-bird-collector:ci .
