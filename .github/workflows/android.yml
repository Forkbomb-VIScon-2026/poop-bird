name: Android

# Builds the Android app's debug APK (README "Android app") and keeps it as an
# artifact for a week. A workflow of its own, not a job in CI: deploy.yml waits
# for CI, and the web version must never wait for the app.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Capacitor 8 builds with Java 21; the runner has the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run fetch-model
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: poopy-bird-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
