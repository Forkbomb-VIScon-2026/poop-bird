name: Deploy

# Deploys main to the team VM once CI has passed on it. The image is built here
# and shipped over SSH, so the VM needs neither the source nor repo access.
#
# Repository secrets:
#   DEPLOY_HOST         the VM's direct address, NN-direct.viscon-hackathon.ch
#   DEPLOY_SSH_KEY      private key whose public half is in the VM's
#                       ~viscon/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan NN-direct.viscon-hackathon.ch`
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only after a successful CI run on a push to main (not on PRs from a
    # branch named main), or when started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Set the DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS repository secrets first."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          docker build --build-arg APP_COMMIT="$SHA" -t "poop-bird:$SHA" .
          docker build -f collector/Dockerfile -t "poop-bird-collector:$SHA" .
          # The voice image is big (PyTorch), so it is tagged by the content of
          # voice/ and only built and shipped when the VM doesn't have it yet.
          VOICE_TAG=$(git rev-parse HEAD:voice)
          echo "VOICE_TAG=$VOICE_TAG" >> "$GITHUB_ENV"
          if ssh "viscon@$DEPLOY_HOST" docker image inspect "poop-bird-voice:$VOICE_TAG" >/dev/null 2>&1; then
            echo "VOICE_SHIP=" >> "$GITHUB_ENV"
          else
            docker build -f voice/Dockerfile -t "poop-bird-voice:$VOICE_TAG" .
            echo "VOICE_SHIP=poop-bird-voice:$VOICE_TAG" >> "$GITHUB_ENV"
          fi

      - name: Ship images and restart the containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          docker save "poop-bird:$SHA" "poop-bird-collector:$SHA" $VOICE_SHIP | gzip | ssh "viscon@$DEPLOY_HOST" 'gunzip | docker load'
          ssh "viscon@$DEPLOY_HOST" bash -s -- "$SHA" "$VOICE_TAG" <<'EOF'
            set -e
            SHA=$1
            VOICE_TAG=$2
            # The game's Caddy reaches the collector as "collector" on this network.
            docker network inspect poopbird >/dev/null 2>&1 || docker network create poopbird
            # Collector credentials, generated once and kept on the VM only:
            # COLLECTION_CODE goes into the collect link, DEV_TOKEN is for the team.
            ENV_FILE=~/poopbird-collector.env
            if [ ! -f "$ENV_FILE" ]; then
              hex() { head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
              ( umask 077; printf 'COLLECTION_CODE=%s\nDEV_TOKEN=%s\n' "$(hex 6)" "$(hex 24)" > "$ENV_FILE" )
            fi
            # Recordings live in the poopbird-data volume, which survives deploys.
            docker rm -f collector 2>/dev/null || true
            docker run -d --name collector --restart unless-stopped --network poopbird \
              --env-file "$ENV_FILE" -v poopbird-data:/data "poop-bird-collector:$SHA"
            # The bird's voice. Voice cloning needs a Hugging Face token in
            # ~/poopbird-voice.env (HF_TOKEN=hf_...), added by hand; without it the
            # game plays without the voice. The container takes a minute to load
            # its model, so it is only recreated when its image or that file changed.
            VOICE_ENV=~/poopbird-voice.env
            if [ ! -f "$VOICE_ENV" ]; then
              ( umask 077; printf '# HF_TOKEN=hf_... (huggingface.co/kyutai/pocket-tts terms accepted)\n' > "$VOICE_ENV" )
            fi
            VOICE_ID="poop-bird-voice:$VOICE_TAG $(sha256sum < "$VOICE_ENV" | cut -c1-16)"
            if [ "$(docker inspect -f '{{index .Config.Labels "deploy"}}' voice 2>/dev/null)" != "$VOICE_ID" ]; then
              docker rm -f voice 2>/dev/null || true
              # Two cores and capped memory, so it can't starve the game.
              docker run -d --name voice --restart unless-stopped --network poopbird \
                --env-file "$VOICE_ENV" -v poopbird-voice-cache:/cache \
                --cpus 2 --memory 3g --label "deploy=$VOICE_ID" "poop-bird-voice:$VOICE_TAG"
            fi
            docker rm -f poop-bird 2>/dev/null || true
            docker run -d --name poop-bird --restart unless-stopped --network poopbird \
              -p 8080:8080 "poop-bird:$SHA"
            # Drop older images, keep the ones now running
            for image in poop-bird poop-bird-collector; do
              docker images "$image" --format '{{.Repository}}:{{.Tag}}' \
                | grep -vx "$image:$SHA" | xargs -r docker rmi >/dev/null || true
            done
            docker images poop-bird-voice --format '{{.Repository}}:{{.Tag}}' \
              | grep -vx "poop-bird-voice:$VOICE_TAG" | xargs -r docker rmi >/dev/null || true
          EOF
