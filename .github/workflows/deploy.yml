name: Deploy

# Deploys main to the team VM once CI has passed on it. The image is built here
# and shipped over SSH, so the VM needs neither the source nor repo access.
#
# Repository secrets:
#   DEPLOY_HOST         the VM's direct address, NN-direct.viscon-hackathon.ch
#   DEPLOY_SSH_KEY      private key whose public half is in the VM's
#                       ~viscon/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan NN-direct.viscon-hackathon.ch`
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only after a successful CI run on a push to main (not on PRs from a
    # branch named main), or when started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Build images
        run: |
          docker build --build-arg APP_COMMIT="$SHA" -t "poopy-bird:$SHA" .
          docker build -f collector/Dockerfile -t "poopy-bird-collector:$SHA" .

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Set the DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS repository secrets first."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship images and restart the containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          docker save "poopy-bird:$SHA" "poopy-bird-collector:$SHA" | gzip | ssh "viscon@$DEPLOY_HOST" 'gunzip | docker load'
          ssh "viscon@$DEPLOY_HOST" bash -s -- "$SHA" <<'EOF'
            set -e
            SHA=$1
            # The game's Caddy reaches the collector as "collector" on this network.
            docker network inspect poopybird >/dev/null 2>&1 || docker network create poopybird
            # Collector credentials, generated once and kept on the VM only:
            # COLLECTION_CODE goes into the collect link, DEV_TOKEN is for the team.
            ENV_FILE=~/poopybird-collector.env
            # The game was renamed from Poop Bird: keep the old credentials.
            if [ ! -f "$ENV_FILE" ] && [ -f ~/poopbird-collector.env ]; then
              cp -p ~/poopbird-collector.env "$ENV_FILE"
            fi
            if [ ! -f "$ENV_FILE" ]; then
              hex() { head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
              ( umask 077; printf 'COLLECTION_CODE=%s\nDEV_TOKEN=%s\n' "$(hex 6)" "$(hex 24)" > "$ENV_FILE" )
            fi
            # Recordings live in the poopybird-data volume, which survives deploys.
            docker rm -f collector 2>/dev/null || true
            # Carry the recordings over from the volume of the old name, once.
            if ! docker volume inspect poopybird-data >/dev/null 2>&1 \
                && docker volume inspect poopbird-data >/dev/null 2>&1; then
              docker volume create poopybird-data >/dev/null
              docker run --rm --user root --entrypoint cp -v poopbird-data:/from -v poopybird-data:/to \
                "poopy-bird-collector:$SHA" -a /from/. /to/ \
                || { docker volume rm poopybird-data; exit 1; }
            fi
            docker run -d --name collector --restart unless-stopped --network poopybird \
              --env-file "$ENV_FILE" -v poopybird-data:/data "poopy-bird-collector:$SHA"
            docker rm -f poopy-bird poop-bird 2>/dev/null || true
            docker run -d --name poopy-bird --restart unless-stopped --network poopybird \
              -p 8080:8080 "poopy-bird:$SHA"
            # Leftovers from before the rename (the old volume stays as a backup).
            docker network rm poopbird >/dev/null 2>&1 || true
            for image in poop-bird poop-bird-collector; do
              docker images "$image" --format '{{.Repository}}:{{.Tag}}' | xargs -r docker rmi >/dev/null || true
            done
            # Drop older images, keep the ones now running
            for image in poopy-bird poopy-bird-collector; do
              docker images "$image" --format '{{.Repository}}:{{.Tag}}' \
                | grep -vx "$image:$SHA" | xargs -r docker rmi >/dev/null || true
            done
          EOF
