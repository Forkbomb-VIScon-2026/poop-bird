services:
  poop-bird:
    build: .
    image: poop-bird:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - collector

  # Face dataset collector. Local credentials only; on the VM, deploy.yml
  # generates real ones in ~/poopbird-collector.env.
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: poop-bird-collector:latest
    restart: unless-stopped
    environment:
      COLLECTION_CODE: local
      DEV_TOKEN: local-dev-token
    volumes:
      - poopbird-data:/data

volumes:
  poopbird-data:
