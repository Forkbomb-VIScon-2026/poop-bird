services:
  poopy-bird:
    build: .
    image: poopy-bird:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - collector

  # Face dataset collector. Local credentials only; on the VM, deploy.yml
  # generates real ones in ~/poopybird-collector.env.
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: poopy-bird-collector:latest
    restart: unless-stopped
    environment:
      COLLECTION_CODE: local
      DEV_TOKEN: local-dev-token
    volumes:
      - poopybird-data:/data

volumes:
  poopybird-data:
