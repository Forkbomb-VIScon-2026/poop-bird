apply plugin: 'com.android.application'

// Release signing (README "Android app"): from android/keystore.properties
// (gitignored; storeFile, storePassword, keyAlias, keyPassword), or from the
// environment in CI (ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD,
// ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
def releaseKey = new Properties()
def keystoreProperties = rootProject.file('keystore.properties')
if (keystoreProperties.exists()) {
    keystoreProperties.withInputStream { releaseKey.load(it) }
} else if (System.getenv('ANDROID_KEYSTORE')) {
    releaseKey.storeFile = System.getenv('ANDROID_KEYSTORE')
    releaseKey.storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    releaseKey.keyAlias = System.getenv('ANDROID_KEY_ALIAS')
    releaseKey.keyPassword = System.getenv('ANDROID_KEY_PASSWORD')
}
def hasReleaseKey = releaseKey.storeFile != null
if (!hasReleaseKey && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('A release build needs the release key: see README "Android app", "Release builds".')
}

android {
    namespace = "ch.forkbomb.poopybird"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ch.forkbomb.poopybird"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Minutes since 1970: every build installs over any older one, from any machine or CI.
        versionCode((int) (System.currentTimeMillis() / 60000))
        versionName new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Committed on purpose (the standard android/android debug key): CI and every
        // laptop sign debug builds alike, so one installs over another without
        // uninstalling, which would delete the app's saved calibrations.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(releaseKey.storeFile)
                storePassword releaseKey.storePassword
                keyAlias releaseKey.keyAlias
                keyPassword releaseKey.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseKey) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
